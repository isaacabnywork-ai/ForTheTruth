version: 1
frontend:
  phases:
    preBuild:
      commands:
        - npm ci
    build:
      commands:
        - (env | grep -e WOOCOMMERCE -e NEXT_PUBLIC -e RAZORPAY -e ADMIN -e BREVO -e SUPABASE >> .env.production) || true
        - (env | grep -e WOOCOMMERCE -e NEXT_PUBLIC -e RAZORPAY -e ADMIN -e BREVO -e SUPABASE >> .env.local) || true
        - npm run build
  artifacts:
    baseDirectory: .next
    files:
      - '**/*'
  cache:
    paths:
      - node_modules/**/*
      - .next/cache/**/*
